services:
  postgres-integration:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: moneytrace_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moneytrace_test"]
      interval: 2s
      timeout: 2s
      retries: 30
